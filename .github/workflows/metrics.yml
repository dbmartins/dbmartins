name: Metrics

on:
  schedule:
    - cron: "0 6 * * *" # diário, 03:00 em Campinas (UTC-3)
  workflow_dispatch:

permissions:
  contents: write # necessário para o commit do metrics.svg

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          config_timezone: America/Sao_Paulo

          base: header, activity, repositories

          plugin_languages: yes

          plugin_lines: yes
          plugin_lines_sections: base, history # sem "repositories": não listar nomes de repos privados

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
